services:
  angelus:
    image: ${ANGELUS_IMAGE:-ygoangelus:local}
    environment:
      SERVER_TOKEN: smoke
    ports:
      - "127.0.0.1::3000"
  smoke:
    image: ${ANGELUS_IMAGE:-ygoangelus:local}
    init: true
    volumes:
      - ./:/app/test:ro
    command: ["node", "test/image-smoke.mjs"]
